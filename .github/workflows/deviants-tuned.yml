name: Deviants Tuned acceptance

on:
  push:
    branches: [deviants-tuned]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deviants-tuned-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf pkg-config wget xdg-utils
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:version
      - run: pnpm test
      - run: pnpm build
      - run: cargo fmt --manifest-path Cargo.toml --all -- --check
        working-directory: src-tauri
      - run: cargo clippy --manifest-path Cargo.toml --all-targets --all-features
        working-directory: src-tauri
      - run: cargo test --manifest-path Cargo.toml --all-targets --all-features
        working-directory: src-tauri

  windows:
    name: Windows x64 NSIS first
    needs: quality
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --no-bundle
      # The existing local config only disables generation of updater signatures.
      # Identifier, version, signing identities and updater endpoints stay intact.
      - run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.local.conf.json
      - name: Verify installed Windows display names
        shell: pwsh
        run: ./scripts/verify-windows-package.ps1
      - run: node scripts/report-bundle-sizes.mjs src-tauri/target/x86_64-pc-windows-msvc/release/bundle
      - uses: actions/upload-artifact@v7
        with:
          name: deviants-tuned-windows-x64-nsis
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x64 ${{ matrix.kind }} second
    needs: windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: deb-rpm
            runner: ubuntu-22.04
            bundles: deb,rpm
          - kind: appimage
            runner: ubuntu-24.04
            bundles: appimage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux prerequisites and media stack
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file gstreamer1.0-alsa gstreamer1.0-gl gstreamer1.0-libav gstreamer1.0-plugins-bad gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pulseaudio libayatana-appindicator3-dev libfuse2 libgtk-3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf pkg-config rpm wget xdg-utils
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: deviants-tuned-${{ matrix.runner }}
      - run: pnpm install --frozen-lockfile
      - name: Verify RPM desktop metadata regression
        if: matrix.kind == 'deb-rpm'
        run: node --test scripts/package-rpm.test.mjs
      - run: pnpm tauri build --target x86_64-unknown-linux-gnu --bundles ${{ matrix.bundles }} --config src-tauri/tauri.local.conf.json
      - name: Post-process AppImage
        if: matrix.kind == 'appimage'
        run: |
          shopt -s nullglob
          images=(src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage)
          test "${#images[@]}" -eq 1
          bash scripts/postprocess-appimage.sh "${images[0]}" x86_64
      - run: node scripts/report-bundle-sizes.mjs src-tauri/target/x86_64-unknown-linux-gnu/release/bundle
      - uses: actions/upload-artifact@v7
        with:
          name: deviants-tuned-linux-x64-${{ matrix.kind }}
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
